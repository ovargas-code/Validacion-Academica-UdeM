spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: always
  mail:
    host: ""

app:
  # Rate limiting desactivado en tests — evita HTTP 429 cuando los tests
  # ejecutan múltiples peticiones seguidas desde la misma IP (127.0.0.1).
  rate-limit:
    rules: []
  security:
    jwt:
      secret: test-secret-for-unit-tests-min-32-chars!!
      expiration-ms: 3600000
    cors:
      allowed-origins: http://localhost:5173
